# News source file. scripts/gen_news.py builds _news.qmd from this at render time.
#
# Manual entries live under `items`. Fields:
#   date: YYYY-MM (required)
#   text: markdown, links relative to site root (required)
#   pub:  optional publication slug (publications/<slug>.qmd). Marks the publication
#         as covered, which suppresses its auto-generated entry.
#
# Automation: every publication page in publications/ dated on or after `auto_since`
# and not covered by a manual `pub` entry gets an automatic news line built from its
# front matter (title, subtitle, date). So adding a new publication page makes it
# appear in News without touching this file. Write a manual entry (with `pub`) when
# a better sentence is wanted.

auto_since: "2026-08"
max_items: 6

items:
